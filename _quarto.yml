project:
  type: website

website:
  title: "Life After Coding"
  site-url: "https://lifeaftercoding.net"
  description: "Personal blog and thoughts on programming, technology, and life"
  
  navbar:
    background: primary
    search: true
    left:
      - text: "Home"
        file: index.qmd
      - text: "Posts"
        file: posts/index.qmd
      - text: "Tags"
        file: tags.qmd
      - text: "About"
        file: about.qmd
    right:
      - icon: github
        href: https://github.com/thec0dewriter
        aria-label: GitHub
      - icon: rss
        href: index.xml
        aria-label: RSS Feed

  page-footer:
    background: light
    left: "© 2025 Life After Coding. All rights reserved."
    right:
      - icon: github
        href: https://github.com/thec0dewriter
        aria-label: GitHub

format:
  html:
    theme:
      light: zephyr
      dark: darkly
    css: styles.css
    highlight-style: github
    toc: true
    link-external-newwindow: true

execute:
  freeze: auto

metadata:
  open-graph: true
  twitter-card:
    card-style: summary_large_image
    creator: "@thec0dewriter"
  image: "/images/blog-cover.jpg"
